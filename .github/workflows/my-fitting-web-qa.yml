name: MY FITTING web static checks
on:
  pull_request:
    paths:
      - 'web/**'
      - 'qa/test_my_fitting_web.py'
      - 'qa/test_campaign_auth_web.py'
      - 'qa/test_campaign_browser.cjs'
      - 'qa/install_my_fitting_native.py'
      - '.github/workflows/my-fitting-web-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check web/brand-data.js
          node --check web/fitting.js
      - name: Validate page wiring and storefront disclaimers
        run: python3 qa/test_my_fitting_web.py
      - name: Validate campaign, account preview and local navigation
        run: python3 qa/test_campaign_auth_web.py

  native-patch-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate native patch generator syntax
        run: python3 -m py_compile qa/install_my_fitting_native.py
      - name: Extract archived app and apply fitting entrypoint
        run: |
          unzip -q HYRAM_GOLF_RC24_SOURCE.zip
          cd hyram_rc9
          python3 ../qa/install_my_fitting_native.py
          grep -q "class HyramMyFittingScreen" lib/screens/hyram_my_fitting_screen.dart
          grep -q "push(const HyramMyFittingScreen())" lib/screens/home_screen.dart
          echo "PASS - Flutter fitting screen created and linked in home"

  responsive-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch local static web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory web >/tmp/hyram-http.log 2>&1 &
          curl -f --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/
      - name: Test 375px 390px and desktop with screenshots
        run: node qa/test_campaign_browser.cjs
      - name: Upload campaign screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyram-campaign-account-screenshots
          path: qa/screenshots/campaign-account/
          if-no-files-found: ignore
