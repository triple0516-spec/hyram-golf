name: MY FITTING web static checks
on:
  pull_request:
    paths:
      - 'web/**'
      - 'qa/test_my_fitting_web.py'
      - '.github/workflows/my-fitting-web-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check web/brand-data.js
          node --check web/fitting.js
      - name: Validate page wiring and storefront disclaimers
        run: python3 qa/test_my_fitting_web.py
