name: Build HYRAM Android QA APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - HYRAM_GOLF_RC24_SOURCE.zip
      - qa/**
      - .github/workflows/build-android-apk.yml
  push:
    branches: [main]
    paths:
      - HYRAM_GOLF_RC24_SOURCE.zip
      - qa/**
      - .github/workflows/build-android-apk.yml

permissions:
  contents: read

concurrency:
  group: hyram-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate local replay syntax
        run: bash -n qa/validate_rc24.sh
      - name: Extract and patch RC24 source
        run: |
          unzip -q HYRAM_GOLF_RC24_SOURCE.zip
          cd hyram_rc9
          patch --batch --forward -p1 < ../qa/rc24-ui-fixes.patch
          mkdir -p ../evidence
      - name: Apply HYRAM light premium app theme and membership tiers
        working-directory: hyram_rc9
        run: python3 ../qa/apply_light_premium.py
      - name: Verify HYRAM visual contract
        working-directory: hyram_rc9
        run: python3 ../qa/verify_light_premium.py
      - name: Reserve disk space for Android build and emulator
        run: |
          set -euo pipefail
          df -h / | tee evidence/disk-before.log
          # These are unused preinstalled toolchains on this disposable runner.
          # Keep Android SDK/NDK, Java, Flutter and all repository files.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tee evidence/disk-after.log
          available_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          test "$available_kb" -ge 15728640
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Toolchain evidence
        run: |
          set -euo pipefail
          { flutter --version; dart --version; adb version; java -version; javac -version; flutter doctor -v; } 2>&1 | tee evidence/toolchain.log
      - name: Generate Android runner
        working-directory: hyram_rc9
        run: flutter create . --platforms=android --org com.hyram --project-name hyram_golf
      - name: Configure foreground location
        working-directory: hyram_rc9
        run: python3 tool/configure_mobile_hosts.py android
      - name: Configure Android minimum SDK for health
        working-directory: hyram_rc9
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/build.gradle.kts")
          source = path.read_text()
          updated, count = re.subn(
              r"(?m)^(\s*)minSdk\s*=\s*[^\n]+$",
              r"\1minSdk = 26",
              source,
          )
          if count != 1:
              raise SystemExit(f"Expected one minSdk assignment, found {count}")
          path.write_text(updated)
          print("Configured minSdk = 26")
          PY
      - name: Fetch dependencies
        working-directory: hyram_rc9
        run: flutter pub get
      - name: Analyze
        working-directory: hyram_rc9
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ../evidence/analyze.log
      - name: Internal tests
        working-directory: hyram_rc9
        run: |
          set -o pipefail
          flutter test test --dart-define=HYRAM_ENV=internal 2>&1 | tee ../evidence/internal-tests.log
      - name: Production tests
        working-directory: hyram_rc9
        run: |
          set -o pipefail
          flutter test test 2>&1 | tee ../evidence/production-tests.log
      - name: Limit Gradle resource usage
        working-directory: hyram_rc9
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/gradle.properties")
          limits = {
              "org.gradle.jvmargs": "-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError",
              "org.gradle.workers.max": "2",
              "org.gradle.parallel": "false",
              "kotlin.daemon.jvmargs": "-Xmx512m",
          }
          lines = p.read_text().splitlines()
          lines = [line for line in lines if line.split("=", 1)[0].strip() not in limits]
          p.write_text("\n".join(lines + [f"{k}={v}" for k, v in limits.items()]) + "\n")
          PY
      - name: Precompile integration APK before starting emulator
        working-directory: hyram_rc9
        timeout-minutes: 20
        run: |
          set -euo pipefail
          { date -u; free -h; df -h /; } | tee ../evidence/resources-before-build.log
          flutter build apk --debug --target=integration_test/app_flow_test.dart --dart-define=HYRAM_ENV=internal 2>&1 | tee ../evidence/integration-prebuild.log
      - name: Enable runner access to Android virtualization
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
      - name: Android integration gate
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            cd hyram_rc9 && env -u BASH_ENV bash --noprofile --norc -eo pipefail -c 'set -u; test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" = "1"; flutter test integration_test/app_flow_test.dart -d emulator-5554 --dart-define=HYRAM_ENV=internal 2>&1 | tee ../evidence/android-integration.log'
      - name: Build debug APK
        working-directory: hyram_rc9
        run: |
          set -o pipefail
          flutter build apk --debug --dart-define=HYRAM_ENV=internal 2>&1 | tee ../evidence/apk-build.log
      - name: Verify APK and checksum
        working-directory: hyram_rc9
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/app-debug.apk.sha256
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: hyram-golf-qa-apk
          path: |
            hyram_rc9/build/app/outputs/flutter-apk/app-debug.apk
            hyram_rc9/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
      - name: Record final runner resources
        if: always()
        run: |
          { date -u; free -h; df -h /; ps -eo pid,comm,%cpu,%mem --sort=-%mem | head -25; } > evidence/resources-final.log
      - name: Preserve gate evidence and dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyram-build-evidence
          path: |
            evidence/
            hyram_rc9/pubspec.lock
            hyram_rc9/android/app/build.gradle.kts
            hyram_rc9/android/settings.gradle.kts
            hyram_rc9/android/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: warn
