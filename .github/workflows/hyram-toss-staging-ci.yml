name: HYRAM Toss D1 staging tests
on:
  pull_request:
    paths:
      - 'staging/payments/**'
      - '.github/workflows/hyram-toss-staging-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify D1 SQL and test checkout wiring
        run: python -m unittest discover -s staging/payments -p '*smoke.py'
      - name: Verify mocked Toss server confirmations and idempotency
        run: node --test staging/payments/worker.test.mjs
